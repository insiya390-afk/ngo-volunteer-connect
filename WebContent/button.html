<!DOCTYPE html>
<html>
<head>
	<title></title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
	<button class="btn btn-success" data-target="#mymodal" data-toggle="modal">Click here</button>
	<div class="modal fade" id="mymodal">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h3 class="text-center text-primary">Create a Post</h3>
					<button type="button" class="close" data-dismiss="modal">&times;</button>



				</div>
				<div class="modal-body">
					<form>
						<div class="form-group">
							<label><i class="fa fa-user fa-2x"></i>Username</label>
							<input type="text" name="" class="form-control" >
						</div>
						<div class="form-group">
							<label><i class="fa fa-lock fa-2x"></i>Password</label>
							<input type="Password" name="" class="form-control" >
						</div>
						<div class="form-group">
							<label><i class="fa fa-envelope fa-2x"></i>Email</label>
							<input type="Email" name="" class="form-control" >
						</div>
					</form>
				</div>
				<div class="modal-footer justify-content-center">
					<button class="btn btn-danger" data-dismiss="modal">Create</button>
				</div>

			</div>
		</div>
	</div>
</body>
</html>
